# Tiny Tapeout project information
project:
  title:        "CHIMERA-1 Elastic CPU/GPU Micro-Core"      # Project title
  author:       "Jack Record"      # Your name
  discord:      "glitche"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Unified morphing CPU/GPU core slice with 0-cycle wavefront bank switching, FMA/DOT ALU, and 2D Morton Z-order address encoder"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (50 MHz SkyWater 130nm target)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_xorynstudios_chimera"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "OPCODE_0"
  ui[1]: "OPCODE_1"
  ui[2]: "OPCODE_2"
  ui[3]: "MORPH_WAVE_EN"
  ui[4]: "L1_MISS_SWAP"
  ui[5]: "REG_SEL_0"
  ui[6]: "REG_SEL_1"
  ui[7]: "EXEC_STROBE"

  # Outputs
  uo[0]: "RESULT_0"
  uo[1]: "RESULT_1"
  uo[2]: "RESULT_2"
  uo[3]: "RESULT_3"
  uo[4]: "RESULT_4"
  uo[5]: "RESULT_5"
  uo[6]: "RESULT_6"
  uo[7]: "RESULT_7"

  # Bidirectional pins
  uio[0]: "IMM_DATA_0"
  uio[1]: "IMM_DATA_1"
  uio[2]: "IMM_DATA_2"
  uio[3]: "IMM_DATA_3"
  uio[4]: "WAVE_ID_0"
  uio[5]: "WAVE_ID_1"
  uio[6]: "MODE_GPU_ACT"
  uio[7]: "ROP_Z_PASS"

# Do not change!
yaml_version: 6
